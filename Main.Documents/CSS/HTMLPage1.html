<!DOCTYPE html>
<html>
<head>
    <title>Page Title</title>
    <style>
        /* 1. Parent Container (UX Dark Mode Example) */
        .parent-container {
            background-color: #121212; /* High-contrast solid background */
            padding: 24px;
            display: flex;
            gap: 16px; /* Clean spacing between list items */
            border-radius: 8px;
        }

        /* 2. The Transparent Square Child Item */
        .transparent-square {
            display: inline-flex;
            width: 56px;
            height: 56px;
            box-sizing: border-box;
            /* Centering the single letter */
            align-items: center;
            justify-content: center;
            /* Border & Background */
            border: 1px solid #ffffff; /* Same color as text */
            background-color: transparent; /* Lets parent #121212 show through */
            /* Typography */
            color: #ffffff; /* Same color as border */
            font-family: 'Arial Black', sans-serif;
            font-weight: 900;
            font-size: 2.4rem;
            line-height: 1;
            padding-top: 2px; /* Corrects visual balance for capital letters */
        }




        .pillar-square {

          /* Shape and Size */
          display: inline-flex;
          width: 52px;
          height: 52px;
          box-sizing: border-box;

          /* Centering */
          align-items: center;
          justify-content: center;

          /* Border and Background */
          border: 1px solid #333333; /* Thin dark gray border */
          background-color: transparent;

          /* Pillar Typography */
          color: #333333; /* Dark gray text */
          font-family: 'Arial Black', 'Impact', 'Arial', sans-serif;
          font-weight: 900;
          font-size: 2.8rem;
          line-height: 1;
         margin:2px;
        }

    </style>
</head>
<body>

    <span class="pillar-square">A</span>

    <span class="pillar-square">B</span>

    <span class="pillar-square">C</span>

    <div class="pillar-square">D</div>

    <div class="pillar-square">E</div>

    <span class="pillar-square">F</span>

    <div class="pillar-square">G</div>

    <span class="pillar-square">H</span>

    <div class="pillar-square">I</div>

    <span class="pillar-square">J</span>

    <div class="pillar-square">K</div>

    <span class="pillar-square">L</span>

    <span class="pillar-square">M</span>

    <span class="pillar-square">N</span>

    <span class="pillar-square">O</span>

    <span class="pillar-square">P</span>

    <span class="pillar-square">Q</span>

    <span class="pillar-square">R</span>

    <span class="pillar-square">S</span>

    <span class="pillar-square">T</span>

    <span class="pillar-square">U</span>

    <span class="pillar-square">V</span>

    <span class="pillar-square">W</span>

    <span class="pillar-square">X</span>

    <span class="pillar-square">Y</span>

    <span class="pillar-square">Z</span>

    <div class="parent-container">
        <div class="transparent-square">A</div>
        <div class="transparent-square">B</div>
        <div class="transparent-square">C</div>
    </div>


</body>
</html>
